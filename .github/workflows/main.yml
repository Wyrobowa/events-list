name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # --run because the `test` script is bare `vitest`, which watches by default.
      # Vitest does switch to run mode when CI is set, but relying on that is
      # implicit — an explicit flag cannot hang the runner.
      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
